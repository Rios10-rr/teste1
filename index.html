<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rios ❤️ Eduarda</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      margin:0;
      padding:0;
      background:#F5E8DC;
      font-family:'Segoe UI',sans-serif;
      color:#5C4033;
      overflow:hidden;
    }

    .screen{
      position:absolute;
      inset:0;
      width:100%;
      height:100vh;
      transition:opacity 1s ease, transform 1s ease;
    }

    .hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(1.02);
    }

    /* ========= INTRO ========= */
    .intro{
      z-index:2;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,90,130,.18), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(255,180,210,.12), transparent 30%),
        radial-gradient(circle at 60% 70%, rgba(255,70,100,.12), transparent 35%),
        linear-gradient(135deg,#090909,#111,#160b12);
    }

    .glow{
      position:absolute;
      width:420px;
      height:420px;
      border-radius:50%;
      filter:blur(95px);
      opacity:.35;
      animation:floatGlow 10s ease-in-out infinite;
    }

    .glow.one{background:#ff4d79;top:8%;left:8%}
    .glow.two{background:#ff8fab;bottom:10%;right:12%;animation-delay:2s}
    .glow.three{background:#ff2e63;top:40%;left:40%;animation-delay:4s}

    @keyframes floatGlow{
      0%,100%{transform:translate(0,0) scale(1)}
      50%{transform:translate(35px,-25px) scale(1.12)}
    }

    .petals,.romantic-petals{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .petal{
      position:absolute;
      top:-40px;
      font-size:18px;
      animation:fall linear forwards;
      opacity:.75;
      filter:drop-shadow(0 0 6px rgba(216,139,163,.18));
    }

    @keyframes fall{
      0%{transform:translateY(-40px) translateX(0) rotate(0deg)}
      100%{transform:translateY(110vh) translateX(50px) rotate(360deg)}
    }

    .floating-photos{position:absolute;inset:0;z-index:2}
    .photo{
      position:absolute;
      width:180px;
      height:260px;
      border-radius:20px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 15px 35px rgba(0,0,0,.35);
      animation:floatPhoto 8s ease-in-out infinite;
    }

    .photo img{width:100%;height:100%;object-fit:cover}
    .photo.one{top:14%;left:10%;--r:-8deg}
    .photo.two{top:32%;left:34%;--r:6deg;animation-delay:1.5s}
    .photo.three{bottom:10%;right:18%;--r:-5deg;animation-delay:3s}

    @keyframes floatPhoto{
      0%,100%{transform:translateY(0) rotate(var(--r))}
      50%{transform:translateY(-12px) rotate(var(--r))}
    }

    .panel{
      position:absolute;
      top:0;
      right:0;
      width:380px;
      height:100vh;
      background:rgba(10,10,10,.72);
      backdrop-filter:blur(18px);
      border-left:1px solid rgba(255,255,255,.06);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:20px;
      z-index:5;
      opacity:0;
      transform:translateX(60px);
      transition:1.2s ease;
    }

    .panel.show{opacity:1;transform:translateX(0)}

    .heart{
      font-size:3rem;
      animation:pulse 2s infinite;
      color:#c06a85;
      text-shadow:0 0 12px rgba(216,139,163,.25);
    }

    .title{
      font-size:2rem;
      color:#fff;
      font-weight:600;
    }

    .subtitle{
      max-width:280px;
      text-align:center;
      color:rgba(255,255,255,.7);
    }

    .btn{
      width:220px;
      padding:14px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-primary{
      background:linear-gradient(135deg,#c06a85,#d88ba3);
      color:#fff;
      box-shadow:0 10px 22px rgba(192,106,133,.22);
    }

    .btn-secondary{
      background:rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.08);
    }

    .btn.playing {
      background: linear-gradient(135deg, #ff6b6b, #ff8787);
      border: none;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.12)}
    }

    /* ========= ROMANTIC SCREEN ========= */
    .romantic-screen{
      z-index:1;
      display:flex;
      background:#F5E8DC;
    }

    .romantic-left{
      flex:0.65;
      position:relative;
      overflow:hidden;
      background:#ead8cc;
    }

    .main-photo{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      animation:fadePhoto 2s ease;
    }

    @keyframes fadePhoto{
      from{opacity:.4;transform:scale(1.04)}
      to{opacity:1;transform:scale(1)}
    }

    .photo-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(to right, rgba(0,0,0,.05), rgba(0,0,0,.18)),
        linear-gradient(to top, rgba(0,0,0,.15), transparent 40%);
    }

    .romantic-right{
      width:420px;
      background:rgba(245,232,220,.88);
      backdrop-filter:blur(16px);
      border-left:1px solid rgba(92,64,51,.08);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:18px;
      padding:30px;
      z-index:3;
      color:#5C4033;
    }

    .since{color:rgba(92,64,51,.75);font-size:.95rem}

    .counter{
      text-align:center;
      line-height:1.8;
      font-size:1.05rem;
      color:#5C4033;
    }

    .counter strong{
      color:#c06a85;
      font-size:1.3rem;
    }

    /* ========= LOGIN SCREEN ========= */
    .login-screen{
      z-index:3;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#090909,#111,#160b12);
    }

    .login-screen::before{
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,90,130,.18), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(255,180,210,.12), transparent 30%),
        radial-gradient(circle at 60% 70%, rgba(255,70,100,.12), transparent 35%);
      pointer-events:none;
    }

    .login-container{
      background:rgba(10,10,10,.85);
      backdrop-filter:blur(25px);
      border:1px solid rgba(255,255,255,.08);
      border-radius:25px;
      padding:50px;
      width:100%;
      max-width:400px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
      display:flex;
      flex-direction:column;
      gap:25px;
      position:relative;
      z-index:1;
    }

    .login-header{
      text-align:center;
      gap:15px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .login-heart{
      font-size:2.5rem;
      animation:pulse 2s infinite;
      color:#c06a85;
    }

    .login-title{
      font-size:1.8rem;
      color:#fff;
      font-weight:600;
    }

    .login-subtitle{
      font-size:0.95rem;
      color:rgba(255,255,255,.6);
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .form-label{
      font-size:0.95rem;
      color:rgba(255,255,255,.8);
      font-weight:500;
    }

    .form-input{
      padding:12px 16px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      background:rgba(255,255,255,.05);
      color:#fff;
      font-size:1rem;
      transition:all 0.3s ease;
      font-family:inherit;
    }

    .form-input:focus{
      outline:none;
      border-color:rgba(192,106,133,.5);
      background:rgba(255,255,255,.08);
      box-shadow:0 0 15px rgba(192,106,133,.15);
    }

    .form-input::placeholder{
      color:rgba(255,255,255,.4);
    }

    .login-buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:10px;
    }

    .btn-login{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      font-size:1rem;
      transition:all 0.3s ease;
      font-family:inherit;
    }

    .btn-login-submit{
      background:linear-gradient(135deg,#c06a85,#d88ba3);
      color:#fff;
      box-shadow:0 10px 22px rgba(192,106,133,.22);
    }

    .btn-login-submit:hover{
      transform:translateY(-2px);
      box-shadow:0 15px 30px rgba(192,106,133,.3);
    }

    .btn-login-back{
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.8);
      border:1px solid rgba(255,255,255,.12);
    }

    .btn-login-back:hover{
      background:rgba(255,255,255,.1);
      border-color:rgba(255,255,255,.2);
    }

    .login-error{
      color:#ff6b6b;
      font-size:0.9rem;
      text-align:center;
      min-height:20px;
    }

    /* ========= MOBILE RESPONSIVO ========= */
    @media (max-width: 768px) {
      .intro {
        justify-content: center;
        align-items: center;
      }

      .glow {
        width: 250px;
        height: 250px;
        filter: blur(60px);
        opacity: 0.25;
      }

      .floating-photos {
        display: none;
      }

      .panel {
        position: relative;
        width: 100%;
        height: auto;
        max-width: 90%;
        border-left: none;
        border-radius: 25px;
        padding: 40px 25px;
        transform: scale(0.95);
        opacity: 0;
      }

      .panel.show {
        opacity: 1;
        transform: scale(1);
      }

      .heart {
        font-size: 2.5rem;
      }

      .title {
        font-size: 1.6rem;
      }

      .subtitle {
        font-size: 0.9rem;
        max-width: 250px;
      }

      .btn {
        width: 100%;
        max-width: 220px;
        padding: 12px;
        font-size: 0.95rem;
      }

      /* ROMANTIC SCREEN MOBILE */
      .romantic-screen {
        flex-direction: column;
        justify-content: flex-start;
      }

      .romantic-left {
        flex: 0;
        width: 100%;
        height: 40vh;
        order: -1;
      }

      .romantic-right {
        width: 100%;
        height: 60vh;
        padding: 25px 20px;
        gap: 15px;
        border-left: none;
        border-top: 1px solid rgba(92, 64, 51, 0.08);
        max-width: none;
      }

      .romantic-right .heart {
        font-size: 2rem;
      }

      .romantic-right .title {
        font-size: 1.4rem;
      }

      .since {
        font-size: 0.85rem;
      }

      .counter {
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .counter strong {
        font-size: 1.1rem;
      }

      /* LOGIN SCREEN MOBILE */
      .login-container {
        width: 90%;
        max-width: 350px;
        padding: 35px 25px;
        gap: 20px;
        border-radius: 20px;
      }

      .login-heart {
        font-size: 2rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .login-subtitle {
        font-size: 0.85rem;
      }

      .form-input {
        padding: 11px 14px;
        font-size: 16px;
      }

      .btn-login {
        padding: 12px;
        font-size: 0.95rem;
      }

      .login-error {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .panel {
        padding: 30px 20px;
        max-width: 95%;
      }

      .heart {
        font-size: 2rem;
      }

      .title {
        font-size: 1.3rem;
      }

      .subtitle {
        font-size: 0.8rem;
      }

      .btn {
        width: 100%;
        padding: 11px;
        font-size: 0.9rem;
      }

      .login-container {
        padding: 30px 20px;
        border-radius: 18px;
      }

      .login-heart {
        font-size: 1.8rem;
      }

      .login-title {
        font-size: 1.3rem;
      }

      .form-label {
        font-size: 0.85rem;
      }

      .form-input {
        padding: 10px 12px;
        font-size: 16px;
      }

      .romantic-right {
        height: auto;
        overflow-y: auto;
        padding: 20px;
      }

      .since {
        font-size: 0.8rem;
      }

      .counter {
        font-size: 0.85rem;
      }

      .counter strong {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

<!-- INTRO -->
<section class="screen intro" id="intro">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>
  <div class="petals" id="petals"></div>

  <div class="floating-photos">
    <div class="photo one"><img src="Rios e duda/foto1.jpg"></div>
    <div class="photo two"><img src="Rios e duda/foto2.jpg"></div>
    <div class="photo three"><img src="Rios e duda/foto3.jpg"></div>
  </div>

  <aside class="panel" id="panel">
    <div class="heart">❤️</div>
    <h1 class="title">Rios & Eduarda</h1>
    <p class="subtitle">Um cantinho só nosso, com memórias, música e momentos especiais.</p>
    <button class="btn btn-primary" onclick="entrar()">Entrar</button>
    <button class="btn btn-secondary" onclick="toggleMusic()">Tocar Música</button>
  </aside>
</section>

<!-- LOGIN -->
<section class="screen login-screen hidden" id="loginScreen">
  <div class="login-container">
    <div class="login-header">
      <div class="login-heart">❤️</div>
      <h2 class="login-title">Entre</h2>
      <p class="login-subtitle">Bem-vindo ao nosso cantinho especial</p>
    </div>

    <form id="loginForm" onsubmit="validarLogin(event)">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Digite seu nome de usuário"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Digite sua senha"
          required
        >
      </div>

      <div class="login-error" id="loginError"></div>

      <div class="login-buttons">
        <button type="submit" class="btn-login btn-login-submit">Entrar</button>
        <button type="button" class="btn-login btn-login-back" onclick="voltarParoPainel()">Voltar</button>
      </div>
    </form>
  </div>
</section>

<!-- ROMANTIC -->
<section class="screen romantic-screen hidden" id="romanticScreen">
  <div class="romantic-left">
    <div class="romantic-petals" id="romanticPetals"></div>
    <img src="Rios e duda/foto20.jpg" class="main-photo" id="mainPhoto">
    <div class="photo-overlay"></div>
  </div>

  <div class="romantic-right">
    <div class="heart">❤️</div>
    <h1 class="title" style="color:#5C4033;">Rios & Eduarda</h1>
    <div class="since">Juntos desde 14/08/2025</div>
    <div class="counter" id="counter"></div>
    <button class="btn btn-primary" onclick="toggleMusic()">Tocar Música</button>
  </div>

  <audio id="music" loop>
    <source src="Rios e duda/musica 1.mp3" type="audio/mpeg">
  </audio>
</section>

<script>
  const intro = document.getElementById("intro");
  const romanticScreen = document.getElementById("romanticScreen");
  const loginScreen = document.getElementById("loginScreen");
  const panel = document.getElementById("panel");
  const petals = document.getElementById("petals");
  const romanticPetals = document.getElementById("romanticPetals");
  const music = document.getElementById("music");
  const counter = document.getElementById("counter");
  const mainPhoto = document.getElementById("mainPhoto");
  const loginError = document.getElementById("loginError");

  const photos = ["Rios e duda/foto20.jpg"];
  let currentPhoto = 0;

  // Credenciais de acesso (você pode mudar os valores)
  const validCredentials = {
    username: "maria eduarda",
    password: "14/08/2025"
  };

  setTimeout(()=>panel.classList.add("show"),3500);

  function entrar(){
    intro.classList.add("hidden");
    loginScreen.classList.remove("hidden");
  }

  function validarLogin(event){
    event.preventDefault();
    
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    
    if(username === validCredentials.username && password === validCredentials.password){
      loginError.innerHTML = "";
      document.getElementById("loginForm").reset();
      loginScreen.classList.add("hidden");
      romanticScreen.classList.remove("hidden");
      startCounter();
      startPhotoRotation();
    } else {
      loginError.innerHTML = "Usuário ou senha incorretos!";
    }
  }

  function voltarParoPainel(){
    loginScreen.classList.add("hidden");
    intro.classList.remove("hidden");
    document.getElementById("loginForm").reset();
    loginError.innerHTML = "";
  }

  function toggleMusic(){
    const buttons = document.querySelectorAll('[onclick="toggleMusic()"]');
    if(music.paused){
      music.play();
      buttons.forEach(btn => btn.classList.add('playing'));
    } else {
      music.pause();
      buttons.forEach(btn => btn.classList.remove('playing'));
    }
  }

  function createPetal(target){
    const p = document.createElement("div");
    p.classList.add("petal");
    p.innerHTML = ["🌸","🌺","💮"][Math.floor(Math.random()*3)];
    p.style.left = Math.random()*100+"%";
    p.style.fontSize = (Math.random()*14+12)+"px";
    p.style.animationDuration = (Math.random()*4+5)+"s";
    target.appendChild(p);
    setTimeout(()=>p.remove(),9000);
  }

  setInterval(()=>createPetal(petals),450);
  setInterval(()=>createPetal(romanticPetals),500);

  function startPhotoRotation(){
    setInterval(()=>{
      currentPhoto = (currentPhoto + 1) % photos.length;
      mainPhoto.style.animation = "none";
      mainPhoto.offsetHeight;
      mainPhoto.src = photos[currentPhoto];
      mainPhoto.style.animation = "fadePhoto 2s ease";
    }, 120000);
  }

  function startCounter(){
    function update(){
      const start = new Date("2025-08-14T00:00:00");
      const now = new Date();
      const diff = now - start;

      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff / (1000*60*60)) % 24);
      const minutes = Math.floor((diff / (1000*60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      counter.innerHTML = `
        <strong>${days}</strong> dias<br>
        <strong>${hours}</strong> horas
        <strong>${minutes}</strong> min
        <strong>${seconds}</strong> seg
      `;
    }

    update();
    setInterval(update,1000);
  }
</script>

</body>
</html>
